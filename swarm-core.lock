# The swarm-core release this repository builds on (swarm-routing/ns3-swarm-core#134):
# core/ takes it through its vcpkg port (vcpkg.json pins the same version),
# and the SHA256 below is the release asset's, read from its SHA256SUMS. The
# Makefile and every workflow name the same release (its tag, or the commit it
# names in a `core-deps` input). Never edit it by hand: org-bot's swarm-core-pin
# task opens the bump PR when a newer release is out (swarm-routing/.github
# tools/checks/check-swarm-core-pin.py --bump, which writes it with
# tools/checks/release_lock.py), and the `swarm-core / pin` check verifies it.
SWARM_CORE_REPO=swarm-routing/swarm-core
SWARM_CORE_TAG=v2.1.0
SWARM_CORE_COMMIT=392e84d98cefd45db184d0788c264621f2e58192
SWARM_CORE_VERSION=2.1.0
SWARM_CORE_ASSET=swarm-core-2.1.0.tar.gz
