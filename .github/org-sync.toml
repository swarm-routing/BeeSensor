# org-sync configuration (swarm-routing/.github tools/org-sync).
kind = "protocol"
# bestpractices.dev project (OpenSSF Best Practices badge; id read from the site's public JSON, swarm-routing/.github#765)
bestpractices_project = "17066"
# the CI badge: core/'s workflow (the default ci.yml does not exist here; swarm-routing/.github#415)
ci_workflow = "core.yml"
# the C++ badge: core/'s standard, the one of the ns-3 release the org supports (swarm-routing/ns3-swarm-core#141)
cxx = "23"
# CITATION.cff seed and cite badge. Once Zenodo archives a release: set zenodo_concept = "<record id>"
# (read from Zenodo), then `org_sync.py reseed CITATION.cff` so CITATION.cff names the DOI.
citation = true
title = "BeeSensor"
dual = ["core/"]

[docs]
arena_id = "BeeSensor"  # its id in swarm-routing.github.io site/hub/projects.json (swarm-routing/swarm-routing.github.io#312)

[settings]
# GitHub settings as code: swarm-routing/.github tools/repo-settings (swarm-routing/.github#117).
description = "BeeSensor (Saleem, Ullah & Farooq, 2012), the honeybee-inspired energy-aware routing protocol for wireless sensor networks, as a standalone swarm routing protocol: many-to-one convergecast to a sink, planned as a simulator-agnostic C++ core and an ns-3 contrib module on swarm-core, with a paper-fidelity sheet."
homepage = "https://swarm-routing.github.io/projects/BeeSensor/"
topics = ["beesensor", "bee-colony", "swarm-intelligence", "wireless-sensor-networks", "energy-aware-routing", "convergecast", "routing-protocol", "iot", "ns-3"]
ruleset = "protocol"
# Only checks that run on every PR (pull_request and merge_group). core/'s checks (core.yml,
# swarm-core-pin.yml) are in since #42; add the ns-3 checks once ns3.yml exists.
required_checks = ["check / org-sync", "headers / licence", "title / title", "core", "swarm-core / pin", "review / coderabbit"]
# Merge through a merge queue (swarm-routing/.github#130); every workflow behind a required
# check also runs on merge_group.
merge_queue = true
